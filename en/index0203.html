<style>
:root {
  --c-void: #030405;
  --c-fatal: #ff2a2a;
  --c-text: #e0e6ed;
  --c-text-dim: #a0aabb;
  --c-text-bright: #ffffff;

  --f-tech: 'Share Tech Mono', monospace;

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--c-text); font-family: var(--f-serif); }

#main {
  position: relative; width: 100%; height: 100%;

  align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden;
}

.content {
  position: relative; z-index: 10; max-width: 90%; text-align: center;
  opacity: 0; animation: fadeInSlow 4s ease-out forwards;
}
@keyframes fadeInSlow {
  0% { opacity: 0; transform: translateY(20px); }
  30% { opacity: 1; transform: translateY(0); }
  100% { opacity: 1; }
}

.title {
  font-size: clamp(1.8rem, 6vw, 3.5rem); font-weight: 900;

}

  width: 120px; height: 2px;

}

  color: var(--c-text-bright); line-height: 2.1; margin-bottom: 22px;

  font-size: clamp(0.85rem, 1.8vw, 1rem); color: var(--c-text-dim);
  font-style: italic; border-left: 2px solid var(--c-fatal);

  display: inline-block; max-width: 600px;
}

}

  color: rgba(255,255,255,0.4); letter-spacing: 3px;
  animation: blink 3s ease-in-out infinite; z-index: 10;

@keyframes blink { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }

.langbar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:10000;

<div id="main" onclick="goBack()">
  <canvas id="ecg-bg"></canvas>
  <div class="content">
    <div class="title">『This Life and Eternity &mdash; Alert or Slumbering』</div>
    <div class="subtitle">Life and Death &mdash; a hair's breadth apart</div>
    <div class="divider"></div>
    <div class="main-text" id="main-text"></div>
    <div class="verse" id="verse"></div>
  </div>
  <div class="hint">[ B A C K &nbsp; T O &nbsp; B E T W E E N &nbsp; L I F E &nbsp; A N D &nbsp; D E A T H ]</div>
</div>

<script>
/* ===== ECG Heartbeat Background ===== */
const canvas = document.getElementById('ecg-bg');
const ctx = canvas.getContext('2d');
let ecgX = 0, history = [];
const colors = [
  { stroke: 'rgba(255,50,50,0.9)', shadow: '#ff3333' },
  { stroke: 'rgba(50,150,255,0.9)', shadow: '#3399ff' },
  { stroke: 'rgba(50,255,100,0.9)', shadow: '#33ff66' }
];
let ci = 0, ct = Date.now();

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ecgX = 0; history = [];
}

function drawECG() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (Date.now() - ct > 60000) { ci = (ci + 1) % colors.length; ct = Date.now(); }
  const cy = canvas.height / 2, cycle = (Date.now() / 1000) % 1.2;
  let y = cy;
  if (cycle < 0.1) y = cy;
  else if (cycle < 0.15) y = cy - 20;
  else if (cycle < 0.2) y = cy + 10;
  else if (cycle < 0.35) y = cy - (cycle - 0.2) * 800;
  else if (cycle < 0.5) y = cy + (0.5 - cycle) * 800 - 120;
  else y = cy;
  history.push({ x: ecgX, y: y + (Math.random() - 0.5) * 4 });
  ecgX += 3;
  if (ecgX > canvas.width) { ecgX = 0; history = []; }
  const col = colors[ci];
  ctx.strokeStyle = col.stroke;
  ctx.lineWidth = 2;
  ctx.shadowColor = col.shadow;
  ctx.shadowBlur = 14;
  ctx.beginPath();
  history.forEach(function(p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();
  ctx.shadowBlur = 0;
  requestAnimationFrame(drawECG);
}

initCanvas();
drawECG();
window.addEventListener('resize', initCanvas);

/* ===== Rotating Messages ===== */
var messages = [
  { main: "As it is appointed to man, that he must die once, and after that come judgment\nAnd after death there is judgment", verse: "You keep my steps in your sight. If I should depart from your way, you would know it.", ref: "&mdash; Hebrews 9:27" },
  { main: "While one breath remains, everything is still possible\nIf that breath is cut, everything is void", verse: "Be prudent, like sensible people, not like fools. Make the most of your time, for these are evil days.", ref: "&mdash; Ephesians 5:15-16" },
  { main: "Man, how many days are left to you?\nA wise man dies &mdash; no different from a fool", verse: "You do not know what tomorrow will bring. What is your life? You are a mist that appears for a little while and then vanishes.", ref: "&mdash; James 4:14" },
  { main: "Guard your heart above all else,\nfor everything you do flows from it", verse: "What can a person gain that is worth exchanging their life for?", ref: "&mdash; Matthew 16:26" },
  { main: "Seventy years may be all our days,\nor, if we have the strength, eighty years;\nyet their span is only toil and trouble.", verse: "No one has power over his own life to retain it; no one has power over the day of his death.", ref: "&mdash; Ecclesiastes 8:8" },
  { main: "What, after all, is life and death?\nWhere do we come from, and where do we go?", verse: "For the living must go to the place of the dead, but the dead cannot return to the place of the living.", ref: "&mdash; Ecclesiastes" },
  { main: "Death, quietly, keeps accelerating\nas the great wheel of the age turns on", verse: "Recorded in silence, with sorrow and reverence. May the departed rest; may the living be comforted.", ref: "" }
];

var shown = JSON.parse(localStorage.getItem('shownEternity') || '[]');
if (shown.length >= messages.length) shown = [];
var avail = messages.map(function(_, i) { return i; }).filter(function(i) { return shown.indexOf(i) === -1; });
var idx = avail[Math.floor(Math.random() * avail.length)];
shown.push(idx);
localStorage.setItem('shownEternity', JSON.stringify(shown));
var m = messages[idx];
document.getElementById('main-text').innerHTML = m.main.replace(/\n/g, '<br>');
document.getElementById('verse').innerHTML = m.ref ? m.verse + '<span class="verse-ref">' + m.ref + '</span>' : m.verse;

/* ===== Click → Return to Monitor ===== */
function goBack() {
  document.getElementById('main').style.transition = 'opacity 2s';
  document.getElementById('main').style.opacity = '0';
  setTimeout(function() { window.location.href = 'monitor03E.html'; }, 2000);
}
</script>
