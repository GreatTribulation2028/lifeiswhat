<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e14">
<title>TG 死亡記錄｜Telegram 群組死亡消息分類統計｜生死記錄儀</title>
<meta name="description" content="從 Telegram 群組精準抽取嘅死亡記錄，按死因與年度分類統計，唔同新聞頁混埋。">
<style>

:root{
  --bg:#0a0e14; --panel:#101722; --line:#22303f; --txt:#d5dde8; --dim:#6b7f93;
  --acc:#ff6b35; --gold:#d4a953; --tg:#3fb6e8;
  --mono:"Consolas","Courier New","PingFang HK",monospace;
  --sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.7}
a{color:var(--gold);text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:18px 14px 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.top h1{font-size:clamp(1.4rem,4.6vw,2rem);color:#fff;letter-spacing:1px}
.top .sub{font-family:var(--mono);font-size:12px;color:var(--tg);margin-top:4px}
.back{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--dim);
  border:1px solid var(--line);padding:7px 13px;border-radius:4px}
.back:hover{color:var(--acc);border-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:12px 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);
  border-radius:8px;padding:11px 13px}
.card .n{font-family:var(--mono);font-size:1.5rem;color:#fff;line-height:1.2}
.card .l{font-size:12px;color:var(--dim);margin-top:3px}
.lbl{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:2px;margin:16px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
.chip{font-family:var(--mono);font-size:12.5px;padding:6px 13px;border-radius:16px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);cursor:pointer}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold}
.chip .n{opacity:.65;margin-left:5px;font-size:11.5px}
.chip.sub{font-size:12px;padding:5px 11px}
.chip.sub.on{background:var(--tg);border-color:var(--tg)}
/* ★ 年度統計 */
.yearbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin:10px 0 16px}
.yrow{display:grid;grid-template-columns:52px 1fr 96px;gap:10px;align-items:center;margin:5px 0}
.yrow .yr{font-family:var(--mono);font-size:12.5px;color:var(--gold)}
.ybar{height:15px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;display:flex}
.ybar i{display:block;height:100%}
.yrow .yn{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right}
.ytbl{width:100%;border-collapse:collapse;margin-top:14px;font-family:var(--mono);font-size:11.5px}
.ytbl th,.ytbl td{padding:5px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06)}
.ytbl th{color:var(--dim);font-weight:400;font-size:11px;position:sticky;top:0;background:var(--panel)}
.ytbl td:first-child,.ytbl th:first-child{text-align:left;color:var(--gold)}
.ywrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}
.tools input{flex:1 1 220px;min-width:180px;background:#0b1220;border:1px solid var(--line);
  color:var(--txt);padding:9px 13px;border-radius:6px;font-family:var(--mono);font-size:13px}
.tools input:focus{outline:none;border-color:var(--tg)}
.tools .cnt{font-family:var(--mono);font-size:12px;color:var(--dim)}
.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.row{display:grid;grid-template-columns:92px 160px 1fr 92px;gap:11px;align-items:start;
  padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13.5px}
.row:hover{background:rgba(255,107,53,.05)}
.row .d{font-family:var(--mono);font-size:12px;color:var(--gold)}
.row .g{font-family:var(--mono);font-size:11.5px;color:var(--tg);word-break:break-all}
.row .t{color:var(--txt);word-break:break-word}
.row .u{font-family:var(--mono);font-size:11.5px;text-align:right}
.row .u a{color:var(--dim)}.row .u a:hover{color:var(--acc)}
.empty{padding:36px;text-align:center;color:var(--dim);font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 2px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media(max-width:720px){
  .row{grid-template-columns:1fr;gap:4px}
  .row .u{text-align:left}
  .yrow{grid-template-columns:44px 1fr 70px}
}

.langbar{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:10000;
  font-family:var(--mono,Consolas,monospace);font-size:13px;
  background:rgba(6,10,18,.94);border:1px solid rgba(255,255,255,.10);
  padding:5px 14px;border-radius:20px;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.langbar a{color:#6b7f93;text-decoration:none;margin:0 3px;white-space:nowrap}
.langbar a:hover{color:#d4a953}
.langbar a.on{color:#ff6b35;font-weight:bold}
.langbar i{color:#3a4a5c;font-style:normal;margin:0 1px}
@media(max-width:600px){.langbar{font-size:11.5px;padding:4px 10px}}

</style>
</head>
<body>
<div class="wrap">

<div class="langbar"><a href="tg.html" class="on">繁體</a><i>|</i><a href="zh-cn/tg.html">简体</a><i>|</i><a href="en/tg.html">English</a></div>

<div class="top">
  <div>
    <h1>TG 死亡記錄</h1>
    <div class="sub">TELEGRAM DEATH RECORDS · 群組消息 · 非新聞來源</div>
  </div>
  <a class="back" href="index.html">← 返回生死記錄儀首頁</a>
</div>

<p style="font-size:13px;color:var(--dim);border-left:2px solid var(--tg);padding-left:12px;margin:6px 0 4px">呢啲係 Telegram 群組嘅消息（唔係新聞），質素同新聞唔同，所以獨立一頁，唔溝入新聞 18 類、唔上首頁。只收 death_signal=1 嘅真死亡訊號，傳聞／被查／比喻等已剔除。</p>

<div class="cards" id="cards"></div>

<div class="lbl">第一層：死因分類</div>
<div class="chips" id="chips1"></div>

<div class="lbl">第二層：TG 原始分類</div>
<div class="chips" id="chips2"></div>

<div class="yearbox">
  <div class="lbl" style="margin-top:0">年度統計 <span style="letter-spacing:0">（近 12 年，柱長按比例）</span></div>
  <div id="ybar"></div>
  <div class="legend" id="legend"></div>
  <div class="lbl">每年 × 死因分佈</div>
  <div class="ywrap"><table class="ytbl" id="ytbl"></table></div>
</div>

<div class="tools">
  <input id="q" type="search" placeholder="搜尋關鍵字／群組／內容…">
  <span class="cnt" id="cnt"></span>
</div>

<div class="list" id="list"></div>

<div style="text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;margin-top:26px;line-height:2">
  <span id="gen"></span><br>
  STILL ALIVE Recorder &times; Telegram Death Records
</div>

</div>
<script src="data_tg.js"></script>
<script>

var DATA = window.DATA_TG || {records:[],stats:{},yearly:{},total:0,shown:0};
var REC = DATA.records || [];
var L = {"lang": "zh-Hant", "title": "TG 死亡記錄｜Telegram 群組死亡消息分類統計｜生死記錄儀", "desc": "從 Telegram 群組精準抽取嘅死亡記錄，按死因與年度分類統計，唔同新聞頁混埋。", "h1": "TG 死亡記錄", "sub": "TELEGRAM DEATH RECORDS · 群組消息 · 非新聞來源", "back": "← 返回生死記錄儀首頁", "all": "全部", "search_ph": "搜尋關鍵字／群組／內容…", "l1": "第一層：死因分類", "l2": "第二層：TG 原始分類", "c1": "真死亡事件", "c2": "本頁載入", "c3": "本年度", "c4": "高把握度", "cnt": "顯示", "of": "/", "recs": "筆", "gen": "資料產生時間", "note": "呢啲係 Telegram 群組嘅消息（唔係新聞），質素同新聞唔同，所以獨立一頁，唔溝入新聞 18 類、唔上首頁。只收 death_signal=1 嘅真死亡訊號，傳聞／被查／比喻等已剔除。", "empty": "冇符合條件嘅記錄", "yr": "年度統計", "yrt": "每年 × 死因分佈", "ytcol": "年份", "yttot": "總數", "ylog": "（近 12 年，柱長按比例）", "w": "AI 把握度"};
var BUCKETS = ["sudden", "suicide", "traffic", "drown", "fire", "accident", "medical", "war", "other"];
var BUCKET_LABEL = {"sudden": ["猝死", "猝死", "Sudden death"], "suicide": ["自殺", "自杀", "Suicide"], "traffic": ["交通", "交通", "Traffic"], "drown": ["遇溺", "遇溺", "Drowning"], "fire": ["火警", "火警", "Fire"], "accident": ["意外", "意外", "Accident"], "medical": ["醫療", "医疗", "Medical"], "war": ["戰爭", "战争", "War"], "other": ["其他", "其他", "Other"]};
var BUCKET_COLOR = {"sudden": "#ff3d6b", "suicide": "#b06cff", "traffic": "#ff9100", "drown": "#3fb6e8", "fire": "#ff6b35", "accident": "#d4a953", "medical": "#4ade80", "war": "#94a3b8", "other": "#64748b"};
var CATLABEL = {"14.📌死亡統計": ["死亡統計", "死亡统计", "General death"], "15.📌死亡細分類-心源性猝死": ["心源性猝死", "心源性猝死", "Cardiac / sudden death"], "15.📌死亡細分類-自殺": ["自殺", "自杀", "Suicide"], "15.📌死亡細分類-意外工安": ["意外工安", "意外工安", "Accident / industrial safety"], "15.📌死亡細分類-交通航空": ["交通航空", "交通航空", "Traffic / aviation"], "15.📌死亡細分類-凶案暴力": ["凶案暴力", "凶案暴力", "Homicide / violence"], "15.📌死亡細分類-疾病醫療": ["疾病醫療", "疾病医疗", "Disease / medical"], "15.📌死亡細分類-自然死亡": ["自然死亡", "自然死亡", "Natural death"], "15.📌死亡細分類-戰爭軍事": ["戰爭軍事", "战争军事", "War / military"], "15.📌死亡細分類-災難": ["災難", "灾难", "Disaster"]};
var LI = 0;

var state = {bucket:"", cat:"", q:""};

function catLabel(c){ var v=CATLABEL[c]; return v ? v[LI] : (c||""); }
function bucketLabel(b){ var v=BUCKET_LABEL[b]; return v ? v[LI] : (b||""); }
function bucketColor(b){ return BUCKET_COLOR[b] || "#64748b"; }

function view(){
  var q=state.q.toLowerCase();
  return REC.filter(function(r){
    if(state.bucket && r.b!==state.bucket) return false;
    if(state.cat && r.c!==state.cat) return false;
    if(q){
      var hay=((r.t||"")+" "+(r.g||"")+" "+(r.s||"")).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

function countBucket(b){
  var n=0;
  for(var i=0;i<REC.length;i++){ if(b===""||REC[i].b===b) n++; }
  return n;
}
function countCat(c){
  var n=0;
  for(var i=0;i<REC.length;i++){
    if(state.bucket && REC[i].b!==state.bucket) continue;
    if(c===""||REC[i].c===c) n++;
  }
  return n;
}

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderChips1(){
  var h='<button class="chip'+(state.bucket===""?" on":"")+'" data-b="">'+L.all
        +'<span class="n">'+REC.length.toLocaleString()+'</span></button>';
  for(var i=0;i<BUCKETS.length;i++){
    var b=BUCKETS[i];
    h+='<button class="chip'+(state.bucket===b?" on":"")+'" data-b="'+b+'">'
      +esc(bucketLabel(b))+'<span class="n">'+countBucket(b).toLocaleString()+'</span></button>';
  }
  document.getElementById("chips1").innerHTML=h;
}

function renderChips2(){
  var cats=Object.keys(DATA.stats||{});
  var h='<button class="chip sub'+(state.cat===""?" on":"")+'" data-c="">'+L.all
        +'<span class="n">'+countCat("").toLocaleString()+'</span></button>';
  for(var i=0;i<cats.length;i++){
    var c=cats[i];
    h+='<button class="chip sub'+(state.cat===c?" on":"")+'" data-c="'+esc(c)+'">'
      +esc(catLabel(c))+'<span class="n">'+countCat(c).toLocaleString()+'</span></button>';
  }
  document.getElementById("chips2").innerHTML=h;
}

function renderYearly(){
  var y=DATA.yearly||{};
  var ys=Object.keys(y).sort().reverse();
  var max=0; ys.forEach(function(k){ if(y[k].n>max) max=y[k].n; });
  var h="";
  for(var i=0;i<ys.length;i++){
    var k=ys[i], v=y[k];
    var segs="";
    BUCKETS.forEach(function(b){
      var n=(v.buckets&&v.buckets[b])||0;
      if(!n) return;
      segs+='<i style="width:'+(n*100/v.n).toFixed(2)+'%;background:'
            +bucketColor(b)+'"></i>';
    });
    h+='<div class="yrow"><div class="yr">'+esc(k)+'</div>'
      +'<div class="ybar">'+segs+'</div>'
      +'<div class="yn">'+v.n.toLocaleString()+'</div></div>';
  }
  document.getElementById("ybar").innerHTML=h;

  // 交叉表
  var th='<tr><th>'+L.ytcol+'</th><th>'+L.yttot+'</th>';
  BUCKETS.forEach(function(b){ th+='<th>'+esc(bucketLabel(b))+'</th>'; });
  th+='</tr>';
  var tb="";
  ys.forEach(function(k){
    var v=y[k];
    tb+='<tr><td>'+esc(k)+'</td><td>'+v.n.toLocaleString()+'</td>';
    BUCKETS.forEach(function(b){
      tb+='<td>'+((v.buckets&&v.buckets[b])||0).toLocaleString()+'</td>';
    });
    tb+='</tr>';
  });
  document.getElementById("ytbl").innerHTML=th+tb;

  var lg="";
  BUCKETS.forEach(function(b){
    lg+='<span><i style="background:'+bucketColor(b)+'"></i>'
       +esc(bucketLabel(b))+'</span>';
  });
  document.getElementById("legend").innerHTML=lg;
}

function renderList(){
  var v=view();
  document.getElementById("cnt").textContent =
    L.cnt+" "+v.length.toLocaleString()+" "+L.of+" "+REC.length.toLocaleString()+" "+L.recs;
  var box=document.getElementById("list");
  if(!v.length){ box.innerHTML='<div class="empty">'+L.empty+'</div>'; return; }
  var h="";
  for(var i=0;i<v.length;i++){
    var r=v[i];
    h+='<div class="row">'
      +'<div class="d">'+esc(r.d)+'</div>'
      +'<div class="g">'+esc(r.g||"")+(r.n>1?' <span style="opacity:.6">(×'+r.n+')</span>':'')+'</div>'
      +'<div class="t">'+esc(r.t)+'</div>'
      +'<div class="u">'+(r.u?'<a href="'+esc(r.u)+'" target="_blank" rel="noopener">&#8599;</a>':'')+'</div>'
      +'</div>';
  }
  box.innerHTML=h;
}

function renderCards(){
  var hi=0, y=new Date().getFullYear(), thisY=0;
  for(var i=0;i<REC.length;i++){
    if(REC[i].w>=0.8) hi++;
    if((REC[i].d||"").slice(0,4)===String(y)) thisY++;
  }
  var h="";
  h+='<div class="card"><div class="n">'+((DATA.total||0).toLocaleString())+'</div><div class="l">'+L.c1+'</div></div>';
  h+='<div class="card"><div class="n">'+REC.length.toLocaleString()+'</div><div class="l">'+L.c2+'</div></div>';
  h+='<div class="card"><div class="n">'+thisY.toLocaleString()+'</div><div class="l">'+L.c3+'</div></div>';
  h+='<div class="card"><div class="n">'+hi.toLocaleString()+'</div><div class="l">'+L.c4+'</div></div>';
  document.getElementById("cards").innerHTML=h;
  document.getElementById("gen").textContent = L.gen+" "+(DATA.generated||"—");
}

document.getElementById("chips1").addEventListener("click",function(e){
  var b=e.target.closest("[data-b]"); if(!b) return;
  state.bucket=b.getAttribute("data-b"); state.cat="";
  renderChips1(); renderChips2(); renderList();
});
document.getElementById("chips2").addEventListener("click",function(e){
  var b=e.target.closest("[data-c]"); if(!b) return;
  state.cat=(state.cat===b.getAttribute("data-c"))?"":b.getAttribute("data-c");
  renderChips1(); renderChips2(); renderList();
});
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value.trim(); renderList();
});
renderCards(); renderChips1(); renderChips2(); renderYearly(); renderList();

</script>
</body>
</html>
