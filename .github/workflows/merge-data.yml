name: Merge Data Files

on:
  workflow_dispatch:
  push:
    paths:
      - 'data_*.js'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge all data files into data_merged.js
        run: |
          echo "// AUTO-GENERATED by GitHub Actions — DO NOT EDIT MANUALLY" > data_merged.js
          echo "// Generated: $(date -u '+%Y-%m-%d %H:%M UTC')" >> data_merged.js
          echo "" >> data_merged.js
          # Merge year files in order
          for year in $(seq 2021 $(date +%Y)); do
            if [ -f "data_${year}.js" ]; then
              echo "// === data_${year}.js ===" >> data_merged.js
              cat "data_${year}.js" >> data_merged.js
              echo "" >> data_merged.js
            fi
          done

      - name: Commit data_merged.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_merged.js
          git diff --cached --quiet || git commit -m "chore: auto-merge data files [skip ci]"
          git push
